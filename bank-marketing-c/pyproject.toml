[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cs5487-c-group"
version = "0.2.0"
description = "Reusable manual PCA/SVD and classification experiments for CS5487 Group C"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=1.5", "matplotlib>=3.7", "scikit-learn>=1.2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["cs5487_c_group", "cs5487_c_group.*"]
